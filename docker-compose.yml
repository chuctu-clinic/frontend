# Chạy giao diện bằng nginx:
#   docker compose up --build
# Mở http://localhost:8080 (trang khách) và http://localhost:8080/noi-bo/ (tiếp tân, Admin).
# Mặc định /api được chuyển sang backend đang chạy trên máy này ở cổng 4000 (repo backend: docker compose up).
# Backend ở chỗ khác thì đặt API_UPSTREAM trong file .env, ví dụ API_UPSTREAM=https://api.chuctu.vn
services:
  client:
    build: .
    restart: unless-stopped
    ports:
      - "8080:80"
    environment:
      API_UPSTREAM: ${API_UPSTREAM:-http://host.docker.internal:4000}
    extra_hosts:
      - "host.docker.internal:host-gateway"
