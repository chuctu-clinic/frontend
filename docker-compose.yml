# Chạy giao diện bằng nginx:
#   docker compose up --build
# Mở http://localhost:8080 (trang khách) và http://localhost:8080/noi-bo/ (tiếp tân, Admin).
# Các biến lấy từ file .env cạnh file này (xem .env.example). Mặc định /api được chuyển sang backend
# đang chạy trên máy này ở cổng 4000 (repo backend: docker compose up).
services:
  client:
    build:
      context: .
      args:
        VITE_API_URL: ${VITE_API_URL:-}
    restart: unless-stopped
    ports:
      - "8080:80"
    environment:
      API_UPSTREAM: ${API_UPSTREAM:-http://host.docker.internal:4000}
    extra_hosts:
      - "host.docker.internal:host-gateway"
