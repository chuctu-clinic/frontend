# client-users ở /, client-admin ở /noi-bo/, /api chuyển sang backend (biến API_UPSTREAM, đặt lúc chạy container).
# Cùng một địa chỉ nên hai ứng dụng dùng chung cookie phiên và không cần CORS.
# nginx thay ${API_UPSTREAM} khi khởi động (thư mục /etc/nginx/templates của image nginx chính thức).
server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;

  location /api/ {
    proxy_pass ${API_UPSTREAM};
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  # Tệp đã build có mã băm trong tên, được lưu lâu trên trình duyệt
  location ~ ^/(noi-bo/)?assets/ {
    expires 1y;
    add_header Cache-Control "public, immutable";
    try_files $uri =404;
  }

  location = /noi-bo {
    return 301 /noi-bo/;
  }

  location /noi-bo/ {
    try_files $uri /noi-bo/index.html;
  }

  # Đường dẫn cũ của trang quản trị
  location /quan-tri {
    return 301 /noi-bo$request_uri;
  }

  location / {
    try_files $uri /index.html;
  }
}
