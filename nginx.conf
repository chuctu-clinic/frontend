# Một ứng dụng: trang khách ở /, khu nội bộ ở /noi-bo/; /api chuyển sang backend (biến môi trường API_UPSTREAM).
# Cùng một địa chỉ với API nên cookie phiên là cookie cùng trang, không cần CORS.
# File này là template: nginx thay ${API_UPSTREAM} lúc khởi động container, các biến nginx như $host giữ nguyên.
server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;

  location /api/ {
    proxy_pass ${API_UPSTREAM};
    # Backend ở dịch vụ khác (Render, Railway…) định tuyến theo tên miền của nó, nên gửi đúng Host của backend
    proxy_set_header Host $proxy_host;
    proxy_ssl_server_name on;
    proxy_set_header X-Forwarded-Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  # Tệp đã build có mã băm trong tên, được lưu lâu trên trình duyệt
  location /assets/ {
    expires 1y;
    add_header Cache-Control "public, immutable";
    try_files $uri =404;
  }

  location = /noi-bo {
    return 301 /noi-bo/;
  }

  # Đường dẫn cũ của trang quản trị
  location /quan-tri {
    return 301 /noi-bo$request_uri;
  }

  location / {
    try_files $uri /index.html;
  }
}
